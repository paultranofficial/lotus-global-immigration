name: OneStep intelligence engine
on:
  pull_request:
    paths:
      - 'intelligence-engine/**'
      - 'render.yaml'
      - '.github/workflows/intelligence-engine.yml'
  push:
    branches: [main, 'codex/onestep-*']
    paths:
      - 'intelligence-engine/**'
      - 'render.yaml'
      - '.github/workflows/intelligence-engine.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e './intelligence-engine[api,dev]'
      - run: python -m unittest discover -s intelligence-engine/tests
      - run: node --test intelligence-engine/integration/onestep-client.test.mjs
      - run: python -m onestep_engine.cli export-openapi intelligence-engine/api/openapi.yaml
      - run: git diff --exit-code -- intelligence-engine/api/openapi.yaml
      - run: node build.cjs
      - run: git diff --exit-code -- index.html en/ chinh-sach-du-lieu.html
