components:
  schemas:
    AnalysedMarketResponse:
      properties:
        jurisdiction:
          type: string
          title: Jurisdiction
        rules:
          items:
            $ref: '#/components/schemas/CitedRuleResponse'
          type: array
          title: Rules
        conflicts:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Conflicts
        retrieval:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Retrieval
        pending_source_changes:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Pending Source Changes
        coverage_status:
          type: string
          enum:
          - partial
          - insufficient_verified_data
          title: Coverage Status
        eligibility:
          type: string
          const: requires_assessment
          title: Eligibility
        freshness_flags:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Freshness Flags
        rule_assessments:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Rule Assessments
        evidence_checklist:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Evidence Checklist
        programs:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Programs
        scholarships:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Scholarships
        cost_estimate:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Cost Estimate
        recommendation_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Recommendation Status
      type: object
      required:
      - jurisdiction
      - rules
      - conflicts
      - retrieval
      - pending_source_changes
      - coverage_status
      - eligibility
      - freshness_flags
      - rule_assessments
      - evidence_checklist
      title: AnalysedMarketResponse
    CitationResponse:
      properties:
        source_id:
          type: string
          title: Source Id
        title:
          type: string
          title: Title
        authority:
          type: string
          title: Authority
        url:
          type: string
          title: Url
        last_verified:
          type: string
          format: date
          title: Last Verified
        evidence_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Evidence Id
      type: object
      required:
      - source_id
      - title
      - authority
      - url
      - last_verified
      - evidence_id
      title: CitationResponse
    CitedRuleResponse:
      properties:
        rule:
          $ref: '#/components/schemas/RuleResponse'
        citation:
          $ref: '#/components/schemas/CitationResponse'
      type: object
      required:
      - rule
      - citation
      title: CitedRuleResponse
    ContextRequest:
      properties:
        jurisdictions:
          items:
            $ref: '#/components/schemas/Market'
          type: array
          maxItems: 11
          minItems: 1
          title: Jurisdictions
        applicant_scope:
          type: string
          maxLength: 100
          minLength: 1
          title: Applicant Scope
        as_of:
          type: string
          format: date
          title: As Of
        module:
          anyOf:
          - $ref: '#/components/schemas/Module'
          - type: 'null'
        query:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Query
      additionalProperties: false
      type: object
      required:
      - jurisdictions
      - applicant_scope
      - as_of
      title: ContextRequest
    ContextResponse:
      properties:
        as_of:
          type: string
          format: date
          title: As Of
        applicant_scope:
          type: string
          title: Applicant Scope
        module:
          anyOf:
          - type: string
          - type: 'null'
          title: Module
        query:
          anyOf:
          - type: string
          - type: 'null'
          title: Query
        results:
          items:
            $ref: '#/components/schemas/MarketContextResponse'
          type: array
          title: Results
        advice_status:
          type: string
          title: Advice Status
        retrieval_trust:
          type: string
          title: Retrieval Trust
      type: object
      required:
      - as_of
      - applicant_scope
      - module
      - results
      - advice_status
      - retrieval_trust
      title: ContextResponse
    DecisionRequest:
      properties:
        status:
          type: string
          enum:
          - verified
          - rejected
          title: Status
        reason:
          type: string
          maxLength: 2000
          minLength: 10
          title: Reason
      additionalProperties: false
      type: object
      required:
      - status
      - reason
      title: DecisionRequest
    DocumentReview:
      properties:
        effective_from:
          type: string
          format: date
          title: Effective From
        effective_to:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Effective To
      additionalProperties: false
      type: object
      required:
      - effective_from
      title: DocumentReview
    EvidenceRequest:
      properties:
        source_id:
          type: string
          title: Source Id
        excerpt:
          type: string
          maxLength: 20000
          minLength: 20
          title: Excerpt
        observed_at:
          type: string
          format: date
          title: Observed At
        document_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Id
      additionalProperties: false
      type: object
      required:
      - source_id
      - excerpt
      - observed_at
      title: EvidenceRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IngestionRequest:
      properties:
        source_ids:
          items:
            type: string
          type: array
          maxItems: 3
          minItems: 1
          title: Source Ids
      additionalProperties: false
      type: object
      required:
      - source_ids
      title: IngestionRequest
    KnowledgeVersion:
      properties:
        id:
          type: string
          maxLength: 200
          minLength: 1
          title: Id
        rule_key:
          type: string
          maxLength: 200
          minLength: 1
          title: Rule Key
        module:
          type: string
          enum:
          - institutions
          - programs
          - admissions
          - scholarships
          - english
          - immigration
          title: Module
        jurisdiction:
          $ref: '#/components/schemas/Market'
        applicant_scope:
          type: string
          maxLength: 100
          minLength: 1
          title: Applicant Scope
        title:
          type: string
          maxLength: 300
