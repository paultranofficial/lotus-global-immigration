openapi: 3.1.0
info:
  title: OneStep Education & Migration Intelligence Engine API
  version: 0.1.0
paths:
  /v1/rules/evaluate:
    get:
      summary: Evaluate applicable time-versioned policy rules
      parameters:
        - name: jurisdiction
          in: query
          required: true
          schema: { type: string, examples: ["AU", "UK", "CA"] }
        - name: applicant_scope
          in: query
          required: true
          schema: { type: string, examples: ["student_visa_primary"] }
        - name: as_of
          in: query
          required: true
          schema: { type: string, format: date }
        - name: module
          in: query
          required: false
          schema:
            type: string
            enum: [visa, finance, english, work_rights, post-study, immigration, admissions, scholarships]
      responses:
        "200":
          description: Applicable rules with provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleEvaluationResponse"
  /v1/countries:
    get:
      summary: List supported study-abroad markets
      responses:
        "200":
          description: Country taxonomy
  /v1/sources:
    get:
      summary: List official and trusted sources
      parameters:
        - name: jurisdiction
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Source registry
  /v1/policy/export:
    get:
      summary: Export policy context for AI agents
      parameters:
        - name: jurisdiction
          in: query
          required: false
          schema: { type: string }
        - name: module
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Versioned rules with provenance
  /v1/agents/context:
    post:
      summary: Retrieve cited policy context for OneStep AI agents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jurisdictions, applicant_scope, as_of]
              properties:
                jurisdictions:
                  type: array
                  items: { type: string }
                applicant_scope: { type: string }
                module: { type: string }
                as_of: { type: string, format: date }
      responses:
        "200":
          description: Applicable policy context grouped by jurisdiction
  /v1/agents/profile-analysis:
    post:
      summary: Contract for Profile Analysis Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileAnalysisRequest"
      responses:
        "200":
          description: Profile risk, eligibility and evidence gaps
  /v1/agents/proposal:
    post:
      summary: Contract for Proposal Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposalRequest"
      responses:
        "200":
          description: Shortlisted countries, programs, pathway options and citations
  /v1/cases/{case_id}/policy-snapshot:
    post:
      summary: Freeze policy snapshot for Case Management Agent
      parameters:
        - name: case_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          description: Immutable cited policy snapshot
components:
  schemas:
    RuleEvaluationResponse:
      type: object
      required: [rules, conflicts]
      properties:
        rules:
          type: array
          items:
            type: object
            required: [rule, citation]
            properties:
              rule:
                $ref: "#/components/schemas/PolicyRule"
              citation:
                $ref: "#/components/schemas/Citation"
        conflicts:
          type: array
          items:
            type: object
    PolicyRule:
      type: object
      required:
        - id
        - module
        - jurisdiction
        - applicant_scope
        - title
        - rule_type
        - payload
        - effective_from
        - source_id
        - source_url
        - last_verified
        - confidence
        - status
      properties:
        id: { type: string }
        module: { type: string }
        jurisdiction: { type: string }
        applicant_scope: { type: string }
        title: { type: string }
        rule_type: { type: string }
        payload: { type: object }
        effective_from: { type: string, format: date }
        effective_to:
          type: [string, "null"]
          format: date
        source_id: { type: string }
        source_url: { type: string, format: uri }
        last_verified: { type: string, format: date }
        confidence: { type: number, minimum: 0, maximum: 1 }
        status: { type: string }
    Citation:
      type: object
      required: [source_id, title, authority, url, last_verified]
      properties:
        source_id: { type: string }
        title: { type: string }
        authority: { type: string }
        url: { type: string, format: uri }
        last_verified: { type: string, format: date }
    ProfileAnalysisRequest:
      type: object
      required: [profile, target_markets, as_of]
      properties:
        profile:
          type: object
          additionalProperties: true
        target_markets:
          type: array
          items: { type: string }
        as_of: { type: string, format: date }
    ProposalRequest:
      type: object
      required: [profile_id, preferences, as_of]
      properties:
        profile_id: { type: string }
        preferences:
          type: object
          additionalProperties: true
        as_of: { type: string, format: date }
