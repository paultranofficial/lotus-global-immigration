[project]
name = "onestep-education-migration-intelligence-engine"
version = "0.2.0"
description = "Versioned study-abroad and migration intelligence engine for OneStep."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "pypdf>=5,<7"]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.32,<1"]
dev = ["PyYAML>=6,<7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
